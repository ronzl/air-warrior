<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>空战英豪</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-touch-callout:none; }
body {
  background:#050510;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
  touch-action:none;
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
canvas {
  display:block;
  touch-action:none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== CONFIG =====
const W=400, H=700;

const c=document.getElementById('c');
const cx=c.getContext('2d');
c.width=W; c.height=H;

// Responsive scaling
function resize() {
  const ratio=W/H;
  let w=window.innerWidth, h=window.innerHeight;
  if(w/h>ratio) { w=h*ratio; }
  else { h=w/ratio; }
  c.style.width=w+'px';
  c.style.height=h+'px';
}
window.addEventListener('resize',resize);
resize();

// ===== UTILS =====
const R=(a,b)=>Math.random()*(b-a)+a;
const RI=(a,b)=>Math.floor(R(a,b+1));

// ===== STARS =====
let stars=[];
for(let i=0;i<60;i++) stars.push({x:R(0,W),y:R(0,H),spd:R(0.5,2),s:R(1,2),b:R(0.3,1)});

// ===== ENTITIES =====
let player={x:W/2-18,y:H-90,w:36,h:36,lives:3,inv:0,wp:'n',wpT:0,cd:0,shd:0};

let enemies=[],bullets=[],ebullets=[],pups=[],parts=[];

let score=0,frame=0,spawnC=0,bossC=0,paused=true;

function rect(e){return{x:e.x,y:e.y,w:e.w,h:e.h};}
function coll(a,b){
  const A=rect(a),B=rect(b);
  return A.x<B.x+B.w&&A.x+A.w>B.x&&A.y<B.y+B.h&&A.y+A.h>B.y;
}

// ===== BULLET =====
function mkBullet(x,y,vx,vy,hm,tgt){
  bullets.push({x,y,w:6,h:14,vx,vy,hm:!!hm,tgt,spd:Math.hypot(vx,vy)||8,dmg:hm?2:1,alive:true});
}
function mkEBullet(x,y,vx,vy){
  ebullets.push({x,y,w:6,h:6,vx,vy,alive:true});
}
function mkPowerUp(x,y,t){
  pups.push({x,y,w:22,h:22,t,vy:1.5,time:0,alive:true});
}
function mkParticle(x,y,clr,n){
  for(let i=0;i<(n||15);i++){
    const a=R(0,Math.PI*2),s=R(1,3);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,clr,l:R(10,25),mL:R(10,25),s:R(1.5,3),alive:true});
  }
}

// ===== SPAWN =====
function spawnEnemy(){
  const isBoss=frame>180&&Math.random()<0.06;
  const w=isBoss?44:28,h=isBoss?44:26;
  enemies.push({
    x:R(10,W-10-w),y:-h,w,h,type:isBoss?'b':'n',
    hp:isBoss?6:1,mHp:isBoss?6:1,
    spd:isBoss?1:R(1.2,2.5),vx:isBoss?0:R(-0.3,0.3),ft:isBoss?RI(60,120):0,alive:true
  });
}

// ===== POWERUP SPAWN =====
const PUP_TYPES=['s','m','d'];
function spawnPowerUp(x,y){ mkPowerUp(x-11,y-11,PUP_TYPES[RI(0,2)]); }

// ===== INIT =====
function init(){
  Object.assign(player,{x:W/2-18,y:H-90,w:36,h:36,lives:3,inv:0,wp:'n',wpT:0,cd:0,shd:0});
  enemies=[]; bullets=[]; ebullets=[]; pups=[]; parts=[];
  score=0; frame=0; spawnC=0; bossC=0; paused=false;
}

// ===== UPDATE =====
function update(){
  if(paused) return;
  frame++;

  // Stars
  for(const s of stars){
    s.y+=s.spd;
    if(s.y>H){s.y=-2;s.x=R(0,W);}
  }

  // Player position (touch already set player.x)
  if(player.inv>0) player.inv--;
  if(player.wpT>0){player.wpT--; if(!player.wpT) player.wp='n';}
  if(player.shd>0) player.shd--;
  if(player.cd<=0){
    const bx=player.x+player.w/2-3, by=player.y-10;
    if(player.wp=='s'){
      mkBullet(bx,by,0,-8); mkBullet(bx,by,-1.5,-7); mkBullet(bx,by,1.5,-7);
    }else if(player.wp=='m'){
      let tgt=null,bd=Infinity;
      for(const e of enemies){
        if(!e.alive) continue;
        const d=Math.hypot(e.x+player.x,e.y+player.y);
        if(d<bd){bd=d;tgt=e;}
      }
      const ang=tgt?Math.atan2(tgt.y-player.y,tgt.x-player.x):-Math.PI/2;
      mkBullet(bx,by,Math.cos(ang)*7,Math.sin(ang)*7,true,tgt);
    }else{
      mkBullet(bx,by,0,-8);
    }
    player.cd=player.wp=='s'?15:10;
  }else player.cd--;

  // Spawn
  spawnC++;
  if(spawnC>=(frame<120?60:35)){
    spawnEnemy(); spawnC=0;
  }
  bossC++;
  if(bossC>=300&&frame>300){
    spawnEnemy(); spawnC=0; bossC=0;
    // add extra enemies with boss
    for(let i=0;i<3;i++){const e=enemies[enemies.length-1-i];if(e)e.hp+=2;}
  }

  // Enemies
  for(const e of enemies){
    e.y+=e.spd; e.x+=e.vx;
    if(e.x<5||e.x>W-e.w-5)e.vx*=-1;
    if(e.y>H+30)e.alive=false;
    if(e.type=='b'&&e.y>0){
      e.ft--;
      if(e.ft<=0){
        mkEBullet(e.x+e.w/2-3,e.y+e.h,-1.2,4);
        mkEBullet(e.x+e.w/2-3,e.y+e.h,0,4.5);
        mkEBullet(e.x+e.w/2-3,e.y+e.h,1.2,4);
        e.ft=RI(80,160);
      }
    }
  }
  enemies=enemies.filter(e=>e.alive);

  // Bullets
  for(const b of bullets){
    if(b.hm&&b.tgt&&b.tgt.alive){
      const dx=b.tgt.x-b.x,dy=b.tgt.y-b.y,ang=Math.atan2(dy,dx);
      const cur=Math.atan2(b.vy,b.vx);
      let diff=ang-cur;
      if(diff>Math.PI)diff-=Math.PI*2;
      if(diff<-Math.PI)diff+=Math.PI*2;
      const na=cur+Math.max(-0.05,Math.min(0.05,diff));
      b.vx=Math.cos(na)*b.spd; b.vy=Math.sin(na)*b.spd;
    }
    b.x+=b.vx; b.y+=b.vy;
    if(b.y<-30||b.y>H+30||b.x<-30||b.x>W+30)b.alive=false;
  }
  bullets=bullets.filter(b=>b.alive);

  // Enemy bullets
  for(const eb of ebullets){
    eb.x+=eb.vx; eb.y+=eb.vy;
    if(eb.y>H+20||eb.y<-20||eb.x<-20||eb.x>W+20)eb.alive=false;
  }
  ebullets=ebullets.filter(eb=>eb.alive);

  // Powerups
  for(const p of pups){p.y+=p.vy;p.time++;if(p.y>H+30)p.alive=false;}
  pups=pups.filter(p=>p.alive);

  // Particles
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.l--;if(p.l<=0)p.alive=false;}
  parts=parts.filter(p=>p.alive);

  // ===== COLLISIONS =====
  const pl=player;

  // Bullets vs enemies
  for(const b of bullets){
    if(!b.alive) continue;
    for(const e of enemies){
      if(!e.alive) continue;
      if(coll(b,e)){
        e.hp-=b.dmg; b.alive=false;
        if(e.hp<=0){
          e.alive=false;
          score+=e.type=='b'?50:10;
          const n=e.type=='b'?30:10;
          mkParticle(e.x+e.w/2,e.y+e.h/2,'#ff6600',n);
          mkParticle(e.x+e.w/2,e.y+e.h/2,'#ffaa00',n/2);
          if(e.type=='b'){spawnPowerUp(e.x+e.w/2,e.y+e.h/2);}
        }else{
          mkParticle(b.x,b.y,'#ffcc00',4);
        }
        break;
      }
    }
  }

  // Enemy bullets vs player
  for(const eb of ebullets){
    if(!eb.alive) continue;
    if(coll(eb,pl)){
      eb.alive=false;
      if(pl.shd>0){pl.shd=0;mkParticle(pl.x+pl.w/2,pl.y+pl.h/2,'#00ffff',12);}
      else if(pl.inv<=0){
        pl.lives--;pl.inv=50;
        mkParticle(pl.x+pl.w/2,pl.y+pl.h/2,'#ff4444',12);
        if(pl.lives<=0){paused=true;return;}
      }
    }
  }

  // Enemies vs player
  for(const e of enemies){
    if(!e.alive) continue;
    if(coll(e,pl)){
      e.alive=false;
      mkParticle(e.x+e.w/2,e.y+e.h/2,'#ff8800',15);
      if(pl.shd>0){pl.shd=0;mkParticle(pl.x+pl.w/2,pl.y+pl.h/2,'#00ffff',12);}
      else if(pl.inv<=0){
        pl.lives--;pl.inv=50;
        if(pl.lives<=0){paused=true;return;}
      }
    }
  }

  // Powerups vs player
  for(const p of pups){
    if(!p.alive) continue;
    if(coll(p,pl)){
      p.alive=false;
      mkParticle(p.x+p.w/2,p.y+p.h/2,'#ffff00',8);
      if(p.t=='d'){pl.shd=300;}
      else{pl.wp=p.t;pl.wpT=600;}
    }
  }
}

// ===== DRAW =====
function drawBg(){
  cx.fillStyle='#050510';
  cx.fillRect(0,0,W,H);
  // Stars
  for(const s of stars){
    cx.globalAlpha=s.b;
    cx.fillStyle='#aaccff';
    cx.fillRect(s.x,s.y,s.s,s.s);
  }
  cx.globalAlpha=1;
}

function drawPlayer(){
  const p=player;
  if(p.inv>0&&Math.floor(p.inv/3)%2===0) return;

  // Glow (gradient instead of shadowBlur - much faster)
  const g=cx.createRadialGradient(p.x+18,p.y+18,2,p.x+18,p.y+18,25);
  g.addColorStop(0,'rgba(0,160,255,0.15)');
  g.addColorStop(1,'rgba(0,160,255,0)');
  cx.fillStyle=g;
  cx.fillRect(p.x-7,p.y-7,50,50);

  // Shield
  if(p.shd>0){
    cx.strokeStyle='rgba(0,220,200,'+(0.25+0.2*Math.sin(p.shd*0.1))+')';
    cx.lineWidth=2;
    cx.beginPath();
    cx.arc(p.x+18,p.y+18,22,0,Math.PI*2);
    cx.stroke();
  }

  const xx=p.x+18,yy=p.y+18;
  // Body
  cx.fillStyle='#2a8acc';
  cx.beginPath();
  cx.moveTo(xx,yy-18);
  cx.lineTo(xx-14,yy+8);
  cx.lineTo(xx-7,yy+14);
  cx.lineTo(xx,yy+6);
  cx.lineTo(xx+7,yy+14);
  cx.lineTo(xx+14,yy+8);
  cx.closePath();
  cx.fill();
  cx.strokeStyle='#55ccff';
  cx.lineWidth=1.2;
  cx.stroke();

  // Cockpit
  cx.fillStyle='#88ddff';
  cx.beginPath();
  cx.ellipse(xx,yy-5,4,7,0,0,Math.PI*2);
  cx.fill();

  // Engine glow
  const ec=player.wp=='m'?'#ff6600':player.wp=='s'?'#00ff88':'#4488ff';
  cx.fillStyle=ec;
  cx.globalAlpha=0.6+0.4*Math.sin(frame*0.15);
  cx.beginPath();
  cx.ellipse(xx,yy+13,4,3,0,0,Math.PI*2);
  cx.fill();
  cx.globalAlpha=1;
}

function drawEnemy(e){
  const xx=e.x+e.w/2,yy=e.y+e.h/2;
  if(e.type=='b'){
    // Boss
    cx.fillStyle='#992222';
    cx.beginPath();
    cx.moveTo(xx,yy-22);
    cx.lineTo(xx-22,yy+3);
    cx.lineTo(xx-16,yy+16);
    cx.lineTo(xx-5,yy+22);
    cx.lineTo(xx+5,yy+22);
    cx.lineTo(xx+16,yy+16);
    cx.lineTo(xx+22,yy+3);
    cx.closePath();
    cx.fill();
    cx.strokeStyle='#cc4444';
    cx.lineWidth=1.5;
    cx.stroke();

    // Eye
    cx.fillStyle='#ff2200';
    cx.beginPath();
    cx.arc(xx,yy-2,7,0,Math.PI*2);
    cx.fill();
    cx.fillStyle='#fff';
    cx.beginPath();
    cx.arc(xx-2,yy-4,2.5,0,Math.PI*2);
    cx.fill();

    // HP bar
    cx.fillStyle='rgba(0,0,0,0.5)';
    cx.fillRect(xx-20,yy-30,40,4);
    cx.fillStyle=e.hp/e.mHp>0.3?'#44dd44':'#dd4444';
    cx.fillRect(xx-20,yy-30,40*(e.hp/e.mHp),4);
  }else{
    // Normal
    cx.fillStyle='#cc5533';
    cx.beginPath();
    cx.moveTo(xx,yy+12);
    cx.lineTo(xx-13,yy-3);
    cx.lineTo(xx-8,yy-12);
    cx.lineTo(xx,yy-8);
    cx.lineTo(xx+8,yy-12);
    cx.lineTo(xx+13,yy-3);
    cx.closePath();
    cx.fill();
    cx.strokeStyle='#ee7744';
    cx.lineWidth=1;
    cx.stroke();
    cx.fillStyle='#ff4400';
    cx.beginPath();
    cx.arc(xx,yy,3,0,Math.PI*2);
    cx.fill();
  }
}

function drawBullet(b){
  if(b.hm){
    // Homing
    cx.fillStyle='#ff4400';
    cx.beginPath();
    cx.moveTo(b.x+3,b.y);
    cx.lineTo(b.x,b.y+14);
    cx.lineTo(b.x+6,b.y+14);
    cx.closePath();
    cx.fill();
    cx.fillStyle='rgba(255,100,0,0.3)';
    cx.fillRect(b.x+1,b.y+10,4,6);
  }else{
    // Normal bullet
    const g=cx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
    g.addColorStop(0,'#88ddff');
    g.addColorStop(1,'#0066ff');
    cx.fillStyle=g;
    cx.fillRect(b.x,b.y,b.w,b.h);
  }
}

function drawEBullet(eb){
  cx.fillStyle='#ff4444';
  cx.beginPath();
  cx.arc(eb.x+3,eb.y+3,3,0,Math.PI*2);
  cx.fill();
  cx.fillStyle='#ffaa44';
  cx.beginPath();
  cx.arc(eb.x+3,eb.y+3,1.5,0,Math.PI*2);
  cx.fill();
}

function drawPowerUp(p){
  const xx=p.x+11,yy=p.y+11;
  const pulse=0.7+0.3*Math.sin(p.time*0.1);
  cx.globalAlpha=pulse;
  const color=p.t=='s'?'#00cc66':p.t=='m'?'#ff6600':'#00aaff';
  cx.fillStyle=color;
  cx.beginPath();
  cx.arc(xx,yy,11,0,Math.PI*2);
  cx.fill();
  cx.globalAlpha=1;
  cx.fillStyle='#fff';
  cx.font='bold 12px sans-serif';
  cx.textAlign='center';
  cx.textBaseline='middle';
  cx.fillText(p.t=='s'?'S':p.t=='m'?'M':'D',xx,yy+1);
}

function drawParticle(p){
  const a=p.l/p.mL;
  cx.globalAlpha=a;
  cx.fillStyle=p.clr;
  cx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  cx.globalAlpha=1;
}

function drawUI(){
  cx.fillStyle='#ffd700';
  cx.font='bold 18px sans-serif';
  cx.textAlign='left';
  cx.fillText(score,12,30);

  cx.fillStyle='#ff4444';
  cx.textAlign='center';
  let h='';
  for(let i=0;i<Math.max(0,player.lives);i++)h+='❤';
  cx.font='16px sans-serif';
  cx.fillText(h||'💀',W/2,28);

  // Weapon
  let wt='';
  if(player.shd>0)wt+='🛡';
  wt+=player.wp=='s'?'🔱散':player.wp=='m'?'🎯追':'⚡';
  if(player.wpT>0)wt+=' '+(Math.ceil(player.wpT/60))+'s';
  if(wt){
    cx.fillStyle='#44ddff';
    cx.textAlign='right';
    cx.font='12px sans-serif';
    cx.fillText(wt,W-12,28);
  }
}

function drawStart(){
  cx.fillStyle='rgba(0,0,0,0.7)';
  cx.fillRect(0,0,W,H);

  cx.textAlign='center';
  cx.fillStyle='#44ddff';
  cx.font='bold 44px sans-serif';
  cx.fillText('空战英豪',W/2,H*0.28);

  cx.fillStyle='#aaddff';
  cx.font='14px sans-serif';
  cx.fillText('AIR WARRIOR',W/2,H*0.28+38);

  cx.fillStyle='#ccc';
  cx.font='14px sans-serif';
  const lines=[
    '👆 触摸屏幕左右移动',
    '⚡ 自动开火，消灭敌机',
    '💀 击败Boss掉落特殊武器',
    '🎯 M=追踪  S=散射  🛡=护盾',
  ];
  lines.forEach((t,i)=>cx.fillText(t,W/2,H*0.48+i*30));

  cx.fillStyle='#0066cc';
  roundRect(W/2-75,H*0.75,150,48,10);
  cx.fill();
  cx.fillStyle='#fff';
  cx.font='bold 18px sans-serif';
  cx.fillText('开始游戏',W/2,H*0.75+34);

  cx.fillStyle='rgba(255,255,255,0.35)';
  cx.font='12px sans-serif';
  cx.fillText('点击或触摸开始',W/2,H*0.75+75);
}

function drawGameOver(){
  cx.fillStyle='rgba(0,0,0,0.7)';
  cx.fillRect(0,0,W,H);

  cx.textAlign='center';
  cx.fillStyle='#ff4444';
  cx.font='bold 40px sans-serif';
  cx.fillText('GAME OVER',W/2,H*0.3);

  cx.fillStyle='#ffd700';
  cx.font='bold 26px sans-serif';
  cx.fillText('得分: '+score,W/2,H*0.42);

  cx.fillStyle='#aaa';
  cx.font='14px sans-serif';
  cx.fillText('点击重新开始',W/2,H*0.52);
}

function roundRect(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y);
  cx.quadraticCurveTo(x+w,y,x+w,y+r);
  cx.lineTo(x+w,y+h-r);
  cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  cx.lineTo(x+r,y+h);
  cx.quadraticCurveTo(x,y+h,x,y+h-r);
  cx.lineTo(x,y+r);
  cx.quadraticCurveTo(x,y,x+r,y);
  cx.closePath();
}

// ===== MAIN LOOP =====
function loop(){
  drawBg();
  if(paused && player.lives>0 && frame>0){
    drawGameOver();
    requestAnimationFrame(loop);
    return;
  }
  if(paused && frame===0){
    drawStart();
    requestAnimationFrame(loop);
    return;
  }
  update();
  // Draw
  for(const p of pups) drawPowerUp(p);
  for(const e of enemies) drawEnemy(e);
  for(const b of bullets) drawBullet(b);
  for(const eb of ebullets) drawEBullet(eb);
  drawPlayer();
  for(const p of parts) drawParticle(p);
  drawUI();
  requestAnimationFrame(loop);
}

// ===== TOUCH CONTROLS =====
let touchX=null;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(paused){init();return;}
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  touchX=(t.clientX-rect.left)/rect.width*W;
  player.x=Math.max(0,Math.min(W-player.w,touchX-player.w/2));
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(paused) return;
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  touchX=(t.clientX-rect.left)/rect.width*W;
  player.x=Math.max(0,Math.min(W-player.w,touchX-player.w/2));
},{passive:false});

c.addEventListener('touchend',e=>{touchX=null;});

// Mouse support (desktop testing)
c.addEventListener('mousedown',e=>{
  const rect=c.getBoundingClientRect();
  const mx=(e.clientX-rect.left)/rect.width*W;
  if(paused){init();return;}
  player.x=Math.max(0,Math.min(W-player.w,mx-player.w/2));
});
c.addEventListener('mousemove',e=>{
  if(paused||e.buttons===0) return;
  const rect=c.getBoundingClientRect();
  const mx=(e.clientX-rect.left)/rect.width*W;
  player.x=Math.max(0,Math.min(W-player.w,mx-player.w/2));
});

// Keyboard for testing
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&paused){init();return;}
  if(e.key==='ArrowLeft')player.x=Math.max(0,player.x-8);
  if(e.key==='ArrowRight')player.x=Math.min(W-player.w,player.x+8);
});

// ===== START =====
loop();
</script>
</body>
</html>
